name: ci

on:
  push:
    branches: [main]
  pull_request:

# flutter-version is pinned to the stable release of the first green run
# (2026-10-27); bump it deliberately (plan item 5).

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8

      - name: Resolve workspace
        run: flutter pub get

      - name: Layering rules
        run: dart run tool/check_imports.dart

      - name: Analyze prep_core
        working-directory: packages/prep_core
        run: dart analyze --fatal-infos

      - name: Test prep_core with coverage
        working-directory: packages/prep_core
        run: |
          dart pub global activate coverage
          dart pub global run coverage:test_with_coverage

      # ---- app steps: active once app/ exists (milestone M2) ----
      - name: Generate app code
        if: hashFiles('app/pubspec.yaml') != ''
        working-directory: app
        run: dart run build_runner build

      - name: Analyze app
        if: hashFiles('app/pubspec.yaml') != ''
        working-directory: app
        run: flutter analyze

      - name: Test app with coverage
        if: hashFiles('app/pubspec.yaml') != ''
        working-directory: app
        run: flutter test --coverage

      - name: Coverage gate
        run: |
          if [ -f app/coverage/lcov.info ]; then
            dart run tool/coverage_gate.dart packages/prep_core/coverage/lcov.info app/coverage/lcov.info
          else
            dart run tool/coverage_gate.dart packages/prep_core/coverage/lcov.info
          fi

      - name: Drift schema snapshots are committed
        if: hashFiles('app/pubspec.yaml') != ''
        working-directory: app
        run: |
          dart run drift_dev make-migrations
          # Fails on changed or new (untracked) snapshots, steps or migration tests.
          git status --porcelain -- drift_schemas lib/data/db test/drift
          test -z "$(git status --porcelain -- drift_schemas lib/data/db test/drift)"

      - name: Release build has no INTERNET permission
        if: hashFiles('app/pubspec.yaml') != ''
        run: |
          (cd app && flutter build apk --release)
          AAPT2="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt2"
          ! "$AAPT2" dump permissions app/build/app/outputs/flutter-apk/app-release.apk | grep -q 'android.permission.INTERNET'
